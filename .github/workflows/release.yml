name: Release

# Push a tag like v0.1.0 to build the .vsix, attach it to a GitHub release, and
# publish it to the VS Code Marketplace and Open VSX (when the VSCE_PAT /
# OVSX_PAT repository secrets are set; see PUBLISHING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the tag matches the extension version
        run: |
          version=$(node -p "require('./packages/extension/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - run: node packages/extension/scripts/package.mjs --out polyglot-tutor.vsix

      - uses: softprops/action-gh-release@v2
        with:
          files: polyglot-tutor.vsix
          generate_release_notes: true

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath polyglot-tutor.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.3.0 publish polyglot-tutor.vsix
